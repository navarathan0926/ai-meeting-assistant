services:
  redis:
    image: redis:7-alpine
    container_name: meeting_assistant_redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: meeting_assistant_server
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      PORT: 4000
      # Reach PostgreSQL running on the host machine (credentials from server/.env)
      DB_HOST: host.docker.internal
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:3000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      redis:
        condition: service_started

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    container_name: meeting_assistant_client
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
    depends_on:
      - server

volumes:
  redis-data:
