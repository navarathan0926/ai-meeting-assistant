services:
  server:
    environment:
      NODE_ENV: docker
      DB_HOST: host.docker.internal   # connects to host machine's local Postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux Docker compatibility
    volumes:
      - ./server:/app          # hot-reload: mount source code
      - /app/node_modules      # use container's node_modules, not host's
    command: npm run start:dev

  client:
    environment:
      NODE_ENV: development
    volumes:
      - ./client:/app          # hot-reload: mount source code
      - /app/node_modules      # use container's node_modules, not host's
      - /app/.next             # keep Next.js build output inside container only
    command: npm run dev
